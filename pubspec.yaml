name: strata_conferencia
description: Aplicativo profissional de conferência de drenagem Strata.
publish_to: "none"

version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  pdf: ^3.11.1
  share_plus: ^10.1.4
  open_filex: ^4.6.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image: ^4.3.0
  intl: ^0.19.0
  uuid: ^4.5.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/eixo/